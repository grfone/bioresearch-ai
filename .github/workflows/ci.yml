name: CI

# Continuous integration for bioresearch-ai.
#
# Three parallel jobs run on every push to master and on
# every pull request targeting master:
#
#   1. backend-tests: runs the pytest suite (FSM, citation
#      validator, orchestrator, routes). Uses the MINIMAL
#      requirements set so the test environment matches
#      what gets installed in the production Docker image
#      -- if a test passes locally but fails on minimal
#      deps, that's a real regression.
#
#   2. frontend-tests: runs npm test (vitest). Tests
#      React components, hooks, and TypeScript models.
#
#   3. docker-build: builds the production :minimal
#      Docker image and verifies the container starts
#      and responds healthy. Catches Dockerfile
#      regressions (broken COPY paths, missing deps,
#      port conflicts).
#
# Total wall-clock target: under 6 minutes on a fresh
# runner. The docker-build job is the slowest at ~3 min
# for the cold image cache.
#
# We do NOT run the live /admin/* smoke check in CI
# because:
#
#   - It requires real LLM credentials
#   - It needs network access to CrossRef/OpenAlex/etc.
#   - It's already covered by the manual live-verify
#     pattern documented in the project root
#
# The manual live-verify is the right tool for
# end-to-end contract checks. CI is for fast, hermetic
# regressions.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel any in-progress runs for the same branch on
# a new push -- saves runner minutes when someone
# force-pushes or iterates quickly.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # 1. Backend tests
  # ------------------------------------------------------------------
  backend-tests:
    name: Backend tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/minimal-requirements.txt
            requirements.txt

      - name: Create virtualenv
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip

      - name: Install minimal backend dependencies
        run: |
          . .venv/bin/activate
          # The CI runs against the MINIMAL set so the
          # tests have to work with what the Docker
          # image actually ships with. This catches
          # "test passes locally with full dev deps but
          # breaks in the slim image" regressions -- a
          # class of bug we have hit before.
          pip install -r requirements/minimal-requirements.txt
          # Plus the test-only deps that aren't in
          # minimal-requirements.txt.
          pip install pytest pytest-asyncio

      - name: Run pytest
        env:
          # Set the env vars our settings module requires
          # at instantiation time. CI doesn't have a
          # .env file so we provide minimal stubs.
          # All values are quoted as strings to avoid
          # YAML parsing quirks around colons in URLs.
          APP_ENVIRONMENT: "test"
          DEFAULT_LLM_PROVIDER: "openai"
          OPENAI_API_KEY: "ci-stub-key"
          OPENAI_BASE_URL: "http://localhost:9"
          PUBMED_EMAIL: "ci@example.com"
          DATABASE_URL: "sqlite:///:memory:"
          ABSTRACT_ENRICHER_ENABLED: "false"
          LLM_ABSTRACT_EXTRACTION_ENABLED: "false"
          LOG_LEVEL: "WARNING"
        run: |
          . .venv/bin/activate
          PYTHONPATH=. python -m pytest tests/ -q --tb=short

  # ------------------------------------------------------------------
  # 2. Frontend tests
  # ------------------------------------------------------------------
  frontend-tests:
    name: Frontend tests (Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        # Pin to the version used in production
        # (frontend/Dockerfile uses node:20-bookworm-slim).
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: frontend
        # npm ci is the deterministic equivalent of npm
        # install -- it uses package-lock.json exactly
        # and never modifies it. Required for reproducible
        # CI builds.
        run: npm ci

      - name: Run vitest
        working-directory: frontend
        run: npm test

      - name: Type-check + build
        working-directory: frontend
        # A separate build step catches type errors that
        # vitest might tolerate (vitest uses esbuild which
        # is more permissive than tsc).
        run: npm run build

  # ------------------------------------------------------------------
  # 3. Docker build
  # ------------------------------------------------------------------
  docker-build:
    name: Docker build (:minimal)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Buildx
        # BuildKit is required for the multi-stage
        # Dockerfile (--from=frontend, --chown=app:app).
        uses: docker/setup-buildx-action@v3

      - name: Build :minimal image
        # We don't push from CI -- the image is just
        # validated, not published. The smoke-test step
        # below starts a container from the local image
        # to confirm the entrypoint actually boots.
        run: |
          docker build \
            --target backend-minimal \
            -t bioresearch-ai:ci-minimal \
            .

      - name: Smoke-test container boot
        # Bring up the container, hit /health, and tear
        # down. This catches regressions where the
        # Dockerfile builds cleanly but the container
        # crashes on startup (missing env vars,
        # import errors, port conflicts).
        run: |
          docker run -d \
            --name bioresearch-ai-ci-smoke \
            -p 8001:8000 \
            -e APP_ENVIRONMENT=test \
            -e DEFAULT_LLM_PROVIDER=openai \
            -e OPENAI_API_KEY=ci-stub-key \
            -e OPENAI_BASE_URL=http://localhost:9 \
            -e PUBMED_EMAIL=ci@example.com \
            -e "DATABASE_URL=sqlite:////tmp/ci-smoke.db" \
            -e ABSTRACT_ENRICHER_ENABLED=false \
            -e LLM_ABSTRACT_EXTRACTION_ENABLED=false \
            -e LOG_LEVEL=WARNING \
            bioresearch-ai:ci-minimal
          # Give the container up to 30 seconds to boot.
          for i in $(seq 1 30); do
            sleep 1
            if curl -fs http://localhost:8001/health \
              | grep -q '"status":"healthy"'; then
              echo "container healthy after ${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "container failed to boot in 30s"
              docker logs bioresearch-ai-ci-smoke
              exit 1
            fi
          done

      - name: Tear down smoke-test container
        if: always()
        run: |
          docker stop bioresearch-ai-ci-smoke || true
          docker rm -f bioresearch-ai-ci-smoke || true
