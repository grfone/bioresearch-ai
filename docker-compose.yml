services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Default to the slim image. Pass ``BUILD_TARGET=local``
        # via the bootstrap to use the heavy image.
        BUILD_TARGET: ${BUILD_TARGET:-minimal}
    image: bioresearch-ai:${BUILD_TARGET:-minimal}
    container_name: bioresearch-ai-backend
    env_file: .env
    environment:
      - LLM_PROVIDER=${DEFAULT_LLM_PROVIDER:-openai}
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-deepseek-coder-v2-lite-instruct}
    volumes:
      - ./bioresearch.db:/app/bioresearch.db
    ports:
      - "8000:8000"
    # Only depend on Ollama when the user picked the local LLM.
    depends_on:
      ollama:
        condition: service_started
        required: false
    restart: unless-stopped

  # Ollama is only started when the user picked the local LLM.
  # The bootstrap activates this profile automatically by setting
  # COMPOSE_PROFILES=local in .env when needed.
  ollama:
    profiles: ["local"]
    image: ollama/ollama:latest
    container_name: bioresearch-ai-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    # GPU passthrough — only activated when the host has nvidia-docker
    # configured. The bootstrap script detects this and sets the
    # `OLLAMA_GPU_ENABLED` env var; we use a compose interpolation
    # so the deploy stanza is fully omitted when not supported.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  ollama_models:
