services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Default to the slim image. Pass ``BUILD_TARGET=local``
        # via the bootstrap to use the heavy image.
        BUILD_TARGET: ${BUILD_TARGET:-minimal}
    image: bioresearch-ai:${BUILD_TARGET:-minimal}
    container_name: bioresearch-ai-backend
    env_file: .env
    environment:
      - LLM_PROVIDER=${DEFAULT_LLM_PROVIDER:-openai}
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-deepseek-coder-v2-lite-instruct}
      # Always point the SQLite file inside the writable
      # directory that the bootstrap volume mounts at
      # ``/app/data``. Without this, the container fails with
      # ``sqlite3.OperationalError: unable to open database file``
      # when the host path is missing or is a directory.
      - DATABASE_URL=sqlite:////app/data/bioresearch.db
    volumes:
      # Mount the parent directory, not the file. SQLite needs
      # to be able to create ``bioresearch.db`` (and its WAL/SHM
      # siblings) inside a writable directory. Binding the file
      # itself is fragile: if the host path is missing or is a
      # directory (e.g. the bootstrap created the directory by
      # mistake), the container fails with ``unable to open database
      # file``.
      - ./:/app/data
    ports:
      - "8000:8000"
    # Only depend on Ollama when the user picked the local LLM.
    depends_on:
      ollama:
        condition: service_started
        required: false
    restart: unless-stopped

  # Ollama is only started when the user picked the local LLM.
  # The bootstrap activates this profile automatically by setting
  # COMPOSE_PROFILES=local in .env when needed.
  ollama:
    profiles: ["local"]
    image: ollama/ollama:latest
    container_name: bioresearch-ai-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    # GPU passthrough — only activated when the host has nvidia-docker
    # configured. The bootstrap script detects this and sets the
    # `OLLAMA_GPU_ENABLED` env var; we use a compose interpolation
    # so the deploy stanza is fully omitted when not supported.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  ollama_models:
