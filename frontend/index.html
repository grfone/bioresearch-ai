<!doctype html>
<html lang="en">

<head>

  <!--
    BioResearch AI Frontend

    Purpose
    -------
    Root HTML document for the React application.

    This file provides the initial browser entry point and loads the
    React application through Vite.

    Design Philosophy
    -----------------
    The frontend represents a scientific AI research environment.

    The interface should communicate:

    - precision;
    - trust;
    - scientific discovery;
    - calm intelligence;
    - advanced research operations.

    The metadata and document structure are optimized for:

    - accessibility;
    - browser compatibility;
    - search engine clarity;
    - professional application branding.

    Author
    ------
    Guillermo Ramajo Fernández
  -->


  <meta charset="UTF-8" />


  <!--
    Responsive viewport configuration.

    Ensures the scientific dashboard adapts correctly to:

    - desktop monitors;
    - laptops;
    - tablets;
    - high-resolution displays.
  -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />


  <!--
    Application identity.
  -->
  <title>
    BioResearch AI | Scientific Research Assistant
  </title>


  <!--
    Application description.

    Used by browsers, search engines, and sharing systems.
  -->
  <meta
    name="description"
    content="
      BioResearch AI is an intelligent biomedical research assistant
      for scientific literature discovery, evidence synthesis,
      and AI-assisted research workflows.
    "
  />


  <!--
    Theme color.

    Matches the dark scientific interface palette.
    Used by supported browsers for UI chrome.
  -->
  <meta
    name="theme-color"
    content="#08111F"
  />


  <!--
    Prevents automatic telephone number detection on mobile browsers.
  -->
  <meta
    name="format-detection"
    content="telephone=no"
  />


  <!--
    Typography

    Primary interface fonts:

    - Inter
    - Geist
    - IBM Plex Sans
    - SF Pro fallback

    Loaded from Google Fonts for development.

    In production this can be replaced by:
    - self-hosted fonts;
    - company typography system;
    - CDN optimized assets.
  -->
  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  />

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />


  <!--
    Application favicon.

    Replace this with the final BioResearch AI logo.
  -->
  <link
    rel="icon"
    type="image/svg+xml"
    href="/favicon.svg"
  />


</head>


<body>

  <!--
    React application mount point.

    React renders the complete scientific research interface
    inside this element.
  -->
  <div id="root"></div>


  <!--
    Vite injects the TypeScript React entry point here.
  -->
  <script
    type="module"
    src="/src/main.tsx">
  </script>


</body>


</html>
