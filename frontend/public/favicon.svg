<?xml version="1.0" encoding="UTF-8"?>
<!--
  BioResearch AI — favicon.svg
  -----------------------------
  Compact mark combining:
    - a "B" letterform (for BioResearch)
    - a stylised DNA double-helix (for the biomedical focus)
    - a circuit/node trace (for AI)
  Renders crisp at any size; uses currentColor so the browser
  tab can theme it to match the user agent chrome.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 64 64"
     fill="none"
     stroke="currentColor"
     stroke-width="3"
     stroke-linecap="round"
     stroke-linejoin="round">

  <!-- DNA double helix: two sinusoids crossing -->
  <path d="M 22 8
           C 32 16, 32 24, 22 32
           C 12 40, 32 48, 22 56"
        stroke="#5EE3D6" />
  <path d="M 42 8
           C 32 16, 32 24, 42 32
           C 52 40, 32 48, 42 56"
        stroke="#5EE3D6" />

  <!-- Base pairs: 5 horizontal rungs -->
  <line x1="22" y1="14" x2="42" y2="14" stroke="#5EE3D6" opacity="0.7" />
  <line x1="28" y1="20" x2="36" y2="20" stroke="#5EE3D6" opacity="0.7" />
  <line x1="22" y1="32" x2="42" y2="32" stroke="#5EE3D6" opacity="0.7" />
  <line x1="28" y1="44" x2="36" y2="44" stroke="#5EE3D6" opacity="0.7" />
  <line x1="22" y1="50" x2="42" y2="50" stroke="#5EE3D6" opacity="0.7" />

  <!-- Circular node trace: a node at top-left, an arc connecting to the helix -->
  <circle cx="14" cy="14" r="4" fill="#F59E0B" stroke="none" />
  <path d="M 18 14
           L 28 14"
        stroke="#F59E0B" />

  <!-- Square node at bottom-right -->
  <rect x="48" y="46" width="8" height="8" fill="#F59E0B" stroke="none" />
  <path d="M 38 50
           L 48 50"
        stroke="#F59E0B" />

</svg>